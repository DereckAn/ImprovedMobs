plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
    id 'io.github.flemmli97.multiloader.discord_hook' version '2.+'
}

subprojects {
    repositories {
        mavenLocal()
        maven {
            name = "TenshiLib"
            url = "https://maven.blazing-coop.net/releases"
            content {
                includeGroup 'io.github.flemmli97'
            }
        }
        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
            content {
                includeGroup 'fuzs.forgeconfigapiport'
            }
        }
    }
}
allprojects {
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }
}
