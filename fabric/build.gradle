plugins {
    id 'io.github.flemmli97.multiloader.platform-fabric'
}

ext {
    mod_meta.tenshilib_version = tenshilib_version
    mod_meta.forge_config_api = forge_config_api
}

dependencies {
    implementation "io.github.flemmli97:tenshilib:${tenshilib_version}-fabric"
    // Bundled so players only need to install Improved Mobs
    include "io.github.flemmli97:tenshilib:${tenshilib_version}-fabric"
    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api}"
}
